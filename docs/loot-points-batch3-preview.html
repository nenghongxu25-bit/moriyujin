<!doctype html><meta charset="utf-8"><title>物资点开启动画</title><style>body{background:#1b2525;color:#dedacb;font:16px sans-serif;margin:24px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{background:#293735;padding:16px}h2{font-size:20px}.stage{height:380px;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#344541 0% 25%,#30403c 0% 50%) 0/24px 24px}button{padding:10px;background:#b5ac85;border:0;cursor:pointer}</style><h1>物资点 · 关闭 → 打开</h1><p>点击逐个播放。各组固定 512×512 透明帧，统一缩放并按固定柜体参照对齐。</p><main><article><h2>军用补给箱</h2><div class="stage"><img data-id="supply_crate" src="../assets/animation/container/loot-points-v3/supply_crate/frame_00.png" style="width:300px"></div><p>显示画布 300 × 300 · 4 帧 / 8 FPS</p><button onclick="play('supply_crate')">播放开启动画</button></article><article><h2>钢制武器柜</h2><div class="stage"><img data-id="weapon_locker" src="../assets/animation/container/loot-points-v3/weapon_locker/frame_00.png" style="width:360px"></div><p>显示画布 360 × 360 · 4 帧 / 8 FPS</p><button onclick="play('weapon_locker')">播放开启动画</button></article><article><h2>急救医疗柜</h2><div class="stage"><img data-id="medical_cabinet" src="../assets/animation/container/loot-points-v3/medical_cabinet/frame_00.png" style="width:240px"></div><p>显示画布 240 × 240 · 4 帧 / 8 FPS</p><button onclick="play('medical_cabinet')">播放开启动画</button></article><article><h2>旧式电脑主机</h2><div class="stage"><img data-id="computer_tower" src="../assets/animation/container/loot-points-v3/computer_tower/frame_00.png" style="width:216px"></div><p>显示画布 216 × 216 · 4 帧 / 8 FPS</p><button onclick="play('computer_tower')">播放开启动画</button></article><article><h2>墙挂工装夹克</h2><div class="stage"><img data-id="hanging_jacket" src="../assets/animation/container/loot-points-v3/hanging_jacket/frame_00.png" style="width:236px"></div><p>显示画布 236 × 236 · 4 帧 / 8 FPS</p><button onclick="play('hanging_jacket')">播放开启动画</button></article><article><h2>拉链运动包</h2><div class="stage"><img data-id="sports_bag" src="../assets/animation/container/loot-points-v3/sports_bag/frame_00.png" style="width:216px"></div><p>显示画布 216 × 216 · 4 帧 / 8 FPS</p><button onclick="play('sports_bag')">播放开启动画</button></article></main><script>const timers={};function play(id){clearInterval(timers[id]);let n=0;const img=document.querySelector('[data-id="'+id+'"]');img.src='../assets/animation/container/loot-points-v3/'+id+'/frame_00.png';timers[id]=setInterval(()=>{img.src='../assets/animation/container/loot-points-v3/'+id+'/frame_0'+(++n)+'.png';if(n===3)clearInterval(timers[id]);},125);}</script>
