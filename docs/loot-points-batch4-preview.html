<!doctype html><meta charset="utf-8"><title>物资点开启动画</title><style>body{background:#1b2525;color:#dedacb;font:16px sans-serif;margin:24px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{background:#293735;padding:16px}h2{font-size:20px}.stage{height:380px;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#344541 0% 25%,#30403c 0% 50%) 0/24px 24px}button{padding:10px;background:#b5ac85;border:0;cursor:pointer}</style><h1>物资点 · 关闭 → 打开</h1><p>点击逐个播放。各组固定 512×512 透明帧，统一缩放并按固定柜体参照对齐。</p><main><article><h2>旧木床头柜</h2><div class="stage"><img data-id="bedside_table" src="../assets/animation/container/loot-points-v4/bedside_table/frame_00.png" style="width:232px"></div><p>显示画布 232 × 232 · 4 帧 / 8 FPS</p><button onclick="play('bedside_table')">播放开启动画</button></article><article><h2>旧式办公桌</h2><div class="stage"><img data-id="office_desk" src="../assets/animation/container/loot-points-v4/office_desk/frame_00.png" style="width:340px"></div><p>显示画布 340 × 340 · 4 帧 / 8 FPS</p><button onclick="play('office_desk')">播放开启动画</button></article><article><h2>旧纸箱</h2><div class="stage"><img data-id="cardboard_box" src="../assets/animation/container/loot-points-v4/cardboard_box/frame_00.png" style="width:268px"></div><p>显示画布 268 × 268 · 4 帧 / 8 FPS</p><button onclick="play('cardboard_box')">播放开启动画</button></article><article><h2>厨房吊柜</h2><div class="stage"><img data-id="kitchen_cabinet" src="../assets/animation/container/loot-points-v4/kitchen_cabinet/frame_00.png" style="width:300px"></div><p>显示画布 300 × 300 · 4 帧 / 8 FPS</p><button onclick="play('kitchen_cabinet')">播放开启动画</button></article></main><script>const timers={};function play(id){clearInterval(timers[id]);let n=0;const img=document.querySelector('[data-id="'+id+'"]');img.src='../assets/animation/container/loot-points-v4/'+id+'/frame_00.png';timers[id]=setInterval(()=>{img.src='../assets/animation/container/loot-points-v4/'+id+'/frame_0'+(++n)+'.png';if(n===3)clearInterval(timers[id]);},125);}</script>
