<!doctype html><meta charset="utf-8"><title>物资点开启动画</title><style>body{background:#1b2525;color:#dedacb;font:16px sans-serif;margin:24px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{background:#293735;padding:16px}h2{font-size:20px}.stage{height:380px;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#344541 0% 25%,#30403c 0% 50%) 0/24px 24px}button{padding:10px;background:#b5ac85;border:0;cursor:pointer}</style><h1>物资点 · 关闭 → 打开</h1><p>点击逐个播放。各组固定 512×512 透明帧，统一缩放并按固定柜体参照对齐。</p><main><article><h2>旧式文件柜</h2><div class="stage"><img data-id="filing_cabinet" src="../assets/animation/container/loot-points-v2/filing_cabinet/frame_00.png" style="width:300px"></div><p>显示画布 300 × 300 · 4 帧 / 8 FPS</p><button onclick="play('filing_cabinet')">播放开启动画</button></article><article><h2>旧木衣柜</h2><div class="stage"><img data-id="wardrobe" src="../assets/animation/container/loot-points-v2/wardrobe/frame_00.png" style="width:360px"></div><p>显示画布 360 × 360 · 4 帧 / 8 FPS</p><button onclick="play('wardrobe')">播放开启动画</button></article><article><h2>老式冰箱</h2><div class="stage"><img data-id="refrigerator" src="../assets/animation/container/loot-points-v2/refrigerator/frame_00.png" style="width:340px"></div><p>显示画布 340 × 340 · 4 帧 / 8 FPS</p><button onclick="play('refrigerator')">播放开启动画</button></article><article><h2>硬壳旅行箱</h2><div class="stage"><img data-id="suitcase" src="../assets/animation/container/loot-points-v2/suitcase/frame_00.png" style="width:224px"></div><p>显示画布 224 × 224 · 4 帧 / 8 FPS</p><button onclick="play('suitcase')">播放开启动画</button></article><article><h2>旧式收银机</h2><div class="stage"><img data-id="cash_register" src="../assets/animation/container/loot-points-v2/cash_register/frame_00.png" style="width:192px"></div><p>显示画布 192 × 192 · 4 帧 / 8 FPS</p><button onclick="play('cash_register')">播放开启动画</button></article><article><h2>翻盖垃圾桶</h2><div class="stage"><img data-id="trash_bin" src="../assets/animation/container/loot-points-v2/trash_bin/frame_00.png" style="width:220px"></div><p>显示画布 220 × 220 · 4 帧 / 8 FPS</p><button onclick="play('trash_bin')">播放开启动画</button></article></main><script>const timers={};function play(id){clearInterval(timers[id]);let n=0;const img=document.querySelector('[data-id="'+id+'"]');img.src='../assets/animation/container/loot-points-v2/'+id+'/frame_00.png';timers[id]=setInterval(()=>{img.src='../assets/animation/container/loot-points-v2/'+id+'/frame_0'+(++n)+'.png';if(n===3)clearInterval(timers[id]);},125);}</script>
