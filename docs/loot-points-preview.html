<!doctype html><meta charset="utf-8"><title>物资点开启动画</title><style>body{background:#1b2525;color:#dedacb;font:16px sans-serif;margin:24px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{background:#293735;padding:16px}h2{font-size:20px}.stage{height:320px;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#344541 0% 25%,#30403c 0% 50%) 0/24px 24px}button{padding:10px;background:#b5ac85;border:0;cursor:pointer}</style><h1>物资点 · 关闭 → 打开</h1><p>点击逐个播放。各组固定 512×512 透明帧，统一缩放并按右侧底部对齐。</p><main><article><h2>军用武器箱</h2><div class="stage"><img data-id="weapon_crate" src="../assets/animation/container/loot-points-v1/weapon_crate/frame_00.png" style="width:320px"></div><p>显示画布 320 × 320 · 4 帧 / 8 FPS</p><button onclick="play('weapon_crate')">播放开启动画</button></article><article><h2>钢制弹药箱</h2><div class="stage"><img data-id="ammo_box" src="../assets/animation/container/loot-points-v1/ammo_box/frame_00.png" style="width:176px"></div><p>显示画布 176 × 176 · 4 帧 / 8 FPS</p><button onclick="play('ammo_box')">播放开启动画</button></article><article><h2>急救医疗箱</h2><div class="stage"><img data-id="medical_case" src="../assets/animation/container/loot-points-v1/medical_case/frame_00.png" style="width:208px"></div><p>显示画布 208 × 208 · 4 帧 / 8 FPS</p><button onclick="play('medical_case')">播放开启动画</button></article><article><h2>工业工具箱</h2><div class="stage"><img data-id="toolbox" src="../assets/animation/container/loot-points-v1/toolbox/frame_00.png" style="width:208px"></div><p>显示画布 208 × 208 · 4 帧 / 8 FPS</p><button onclick="play('toolbox')">播放开启动画</button></article><article><h2>帆布旅行袋</h2><div class="stage"><img data-id="duffel_bag" src="../assets/animation/container/loot-points-v1/duffel_bag/frame_00.png" style="width:224px"></div><p>显示画布 224 × 224 · 4 帧 / 8 FPS</p><button onclick="play('duffel_bag')">播放开启动画</button></article><article><h2>机械保险箱</h2><div class="stage"><img data-id="safe" src="../assets/animation/container/loot-points-v1/safe/frame_00.png" style="width:240px"></div><p>显示画布 240 × 240 · 4 帧 / 8 FPS</p><button onclick="play('safe')">播放开启动画</button></article></main><script>const timers={};function play(id){clearInterval(timers[id]);let n=0;const img=document.querySelector('[data-id="'+id+'"]');img.src='../assets/animation/container/loot-points-v1/'+id+'/frame_00.png';timers[id]=setInterval(()=>{img.src='../assets/animation/container/loot-points-v1/'+id+'/frame_0'+(++n)+'.png';if(n===3)clearInterval(timers[id]);},125);}</script>
